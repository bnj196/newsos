services:
  sos-zalo-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sos-zalo-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - ZALO_PHONE=${ZALO_PHONE:-84793634088}
      - ZALO_PASSWORD=${ZALO_PASSWORD:-;;;tuienBin}
      - ZALO_IMEI=${ZALO_IMEI:-5fe2bd7c-47ae-461e-914f-cf01e4670243-16453d6e2683b8800ded2a27c7f595d9}
      - COOKIE_FILE=/app/data/zalo_cookies.json
      - DB_PATH=/app/data/sos_database.db
      - INTERNAL_GROUP_ID=${INTERNAL_GROUP_ID:-}
      - INTERNAL_GROUP_NAME=${INTERNAL_GROUP_NAME:-test group}
      - ADMIN_USER_IDS=${ADMIN_USER_IDS:-}
      - DEFAULT_TIMEOUT_MINUTES=${DEFAULT_TIMEOUT_MINUTES:-30}
      - PORT=8080
    volumes:
      # Mount thư mục lưu trữ dữ liệu bền vững (database SQLite, cookies)
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
